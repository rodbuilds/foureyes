name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners come with Chrome installed; the tests drive it headless.
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
