# Publishes Four Eyes (apps/web) to GitHub Pages at the same address as before,
# https://rodbuilds.github.io/foureyes/, now that index.html lives in apps/web rather than the root.
#
# Needs one setting, once: Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (instead of "Deploy from a branch").
name: Pages

on:
  push:
    branches: [main]
    paths: ['apps/web/index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # only the page itself (and the licence): not the tests or the companion app
      - run: mkdir site && cp apps/web/index.html LICENSE site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
